# Wardrobe AI: every service plus Postgres (with pgvector) in one command.
#
#   copy .env.example .env      # then add GROQ_API_KEY
#   docker compose up --build
#
# UI: http://localhost:8080   API docs: http://localhost:8000/docs

x-python: &python
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wardrobe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: wardrobe
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wardrobe} -d wardrobe"]
      interval: 5s
      timeout: 3s
      retries: 20

  wardrobe:
    <<: *python
    build: ./services/wardrobe
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-wardrobe}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/wardrobe
      ENABLE_ENRICHMENT: "true"
      VISION_SERVICE_URL: http://vision:8002
      EMBEDDING_SERVICE_URL: http://embedding:8003
    volumes:
      - uploads:/data/storage
    ports: ["8001:8001"]
    depends_on:
      postgres: { condition: service_healthy }

  vision:
    <<: *python
    build: ./services/vision
    volumes:
      - ./runs/detect/train-2/weights:/models:ro
    ports: ["8002:8002"]

  embedding:
    <<: *python
    build:
      context: ./services/embedding
      args:
        EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-color}
    environment:
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-color}
    volumes:
      - models-cache:/root/.cache
    ports: ["8003:8003"]

  weather:
    <<: *python
    build: ./services/weather
    ports: ["8004:8004"]

  memory:
    <<: *python
    build: ./services/memory
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-wardrobe}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/memory
      SYNC_WARDROBE_WEAR: "true"
      WARDROBE_SERVICE_URL: http://wardrobe:8001
    ports: ["8006:8006"]
    depends_on:
      postgres: { condition: service_healthy }

  agent:
    <<: *python
    build: ./services/agent
    environment:
      WARDROBE_URL: http://wardrobe:8001
      VISION_URL: http://vision:8002
      EMBED_URL: http://embedding:8003
      WEATHER_URL: http://weather:8004
      MEMORY_URL: http://memory:8006
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-}
    ports: ["8000:8000"]
    depends_on: [wardrobe, weather, memory, embedding]

  ui:
    build: ./ui
    restart: unless-stopped
    ports: ["8080:80"]
    depends_on: [agent]

volumes:
  pgdata:
  uploads:
  models-cache:
