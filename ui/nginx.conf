server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 12m;

  # The API gateway (agent). /api/agent -> http://agent:8000/agent
  location /api/ {
    proxy_pass http://agent:8000/;
    proxy_set_header Host $host;
    proxy_read_timeout 120s;
  }

  # Built files have content hashes in their names: cache them for good.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # index.html must never be cached, or browsers keep loading an old build.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
